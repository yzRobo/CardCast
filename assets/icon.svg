<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CardCast application icon, full-detail variant (32px and above).
       Two fanned trading cards under a broadcast arc: the deck you are showing,
       and the signal carrying it to the stream. Palette matches the app's
       indigo-to-violet theme. See icon-small.svg for the 16/24px variant.
       After editing, regenerate with:  node scripts/build-icon.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ebf5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- Broadcast arcs radiating from the top-right. Only two, and heavy, so the
       signal survives downscaling. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M296 128 A 116 116 0 0 1 412 244" stroke-width="30"/>
    <path d="M344 80 A 184 184 0 0 1 460 244" stroke-width="30" opacity="0.55"/>
  </g>

  <!-- Back card of the fan. -->
  <g transform="rotate(-21 196 330)">
    <rect x="98" y="196" width="196" height="262" rx="28" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Front card. -->
  <g transform="rotate(8 262 324)">
    <rect x="166" y="186" width="202" height="272" rx="32" fill="url(#front)"/>
    <circle cx="267" cy="322" r="47" fill="#7c3aed"/>
  </g>
</svg>
